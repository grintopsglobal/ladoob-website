hero:
  judul: Satu sistem untuk mengelola travel wisata dan Umrah Anda
  paragraf: Ladoob menghubungkan kantor pusat (**Ladoob Core**), aplikasi untuk wisatawan dan jamaah (**Ladoob Compass** dan **Ladoob Masar**), serta aplikasi untuk agen penjualan (**Ladoob Agent**). Data cukup diinput sekali di kantor pusat.
  ctaKedua: Lihat harga
  poin:
    - Lisensi sekali bayar
    - Mode offline untuk jamaah
    - Link afiliasi untuk tiap agen
fitur:
  judul: Satu pusat kendali dan tiga aplikasi lapangan
  deskripsi: "Tiap aplikasi dipakai orang yang berbeda: tim kantor, wisatawan, jamaah, dan agen. Semuanya membaca data yang sama dari Ladoob Core, jadi perubahan cukup diinput sekali."
manfaat:
  judul: Menjaga margin dan memudahkan travel Anda bertumbuh
  narasi: Margin biro perjalanan sering tergerus oleh kebocoran HPP dan administrasi manual yang lambat, meskipun jumlah jamaah dan pesertanya cukup.
  judulMetrik: Dampak operasional
  metrik:
    - angka: 75%
      keterangan: lebih cepat menyusun manifest, roomlist, dan dokumen keberangkatan
    - angka: 0%
      keterangan: kebocoran selisih kurs dan biaya komponen HPP yang tidak tercatat
    - angka: 10x
      keterangan: kapasitas jaringan agen dan affiliator tanpa menambah staf admin
    - angka: 100%
      keterangan: kepemilikan lisensi, tanpa potongan per jamaah atau pax
  poin:
    - judul: HPP dan margin terkendali
      deskripsi: Komponen biaya perjalanan (tiket pesawat, hotel Makkah, Madinah, atau destinasi, visa, transport, handling) dihitung otomatis beserta konversi kursnya sebelum paket dirilis ke agen.
    - judul: Jaringan agen bertambah, admin tidak
      deskripsi: Agen, reseller, dan affiliator membagikan katalog, mendaftarkan jamaah, dan memantau komisinya sendiri lewat Ladoob Agent.
    - judul: Jamaah dan wisatawan dilayani lebih rapi
      deskripsi: Itinerary, nomor kamar, e-ticket, panduan manasik, dan notifikasi jadwal tersedia di Compass dan Masar. Admin tidak perlu mengirim ulang PDF di grup chat.
    - judul: Platform milik Anda sendiri
      deskripsi: Lisensi dibayar sekali di awal, tanpa sewa per kepala atau potongan per transaksi yang membengkak saat musim ramai. Setelah itu cukup biaya cloud dan maintenance tahunan.
harga:
  judul: Paket sesuai skala travel Anda
  deskripsi: Semua paket memakai lisensi **sekali bayar**, ditambah biaya cloud dan maintenance tahunan yang besarnya sudah tercantum di tiap paket.
  catatan: Harga di atas hanya untuk lisensi platform Ladoob dan belum termasuk pembuatan website *company profile* travel Anda. Website tersebut tersedia sebagai layanan tambahan (*add-on*) terpisah.
  labelCta: Pilih Ini Sekarang
blog:
  judul: Artikel untuk pemilik travel
  deskripsi: Panduan praktis untuk pemilik biro wisata dan penyelenggara Umrah tentang margin, agen, dan pelayanan jamaah.
faq:
  judul: Pertanyaan yang sering diajukan
  deskripsi: Pertanyaan Anda belum terjawab? Tanyakan langsung ke tim Ladoob lewat WhatsApp.
banner:
  judul: Jadwalkan demo gratis bersama tim Ladoob
  deskripsi: Ceritakan kebutuhan biro wisata atau travel Umrah Anda, lalu lihat simulasi **Ladoob Core, Compass, Masar, dan Agent** secara langsung.
  catatan: Lewat WhatsApp, langsung ke tim Ladoob.
