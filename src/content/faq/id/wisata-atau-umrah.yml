pertanyaan: "Apakah Ladoob bisa digunakan untuk travel wisata umum saja, atau khusus Umrah & Haji?"
jawaban: "**Bisa keduanya maupun salah satu.** Ekosistem Ladoob dirancang modular: Anda dapat menjalankan lini wisata domestik & internasional melalui aplikasi **Ladoob Compass**, serta menjalankan lini perjalanan ibadah Umrah & Haji khusus melalui aplikasi **Ladoob Masar (مسار)**. Keduanya dikelola terpusat dari satu dashboard **Ladoob Core**."
order: 3
