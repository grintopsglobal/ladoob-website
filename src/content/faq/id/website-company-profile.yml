pertanyaan: "Apakah harga paket sudah termasuk website company profile perusahaan travel kami?"
jawaban: "**Belum termasuk.** Seluruh paket harga Ladoob difokuskan pada ekosistem sistem manajemen operasional (*Ladoob Core Web*) serta aplikasi mobile pelanggan & mitra (*Compass, Masar, Agent*). Apabila perusahaan Anda belum memiliki website profil atau ingin mengintegrasikan katalog website dengan Ladoob Core, layanan pembuatan website *company profile* tersedia sebagai **add-on terpisah**."
order: 2
