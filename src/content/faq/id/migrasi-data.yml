pertanyaan: "Bagaimana proses migrasi data jamaah, paket, dan agen yang sudah ada sebelumnya?"
jawaban: "Ladoob menyediakan fitur **Bulk Import (Excel/CSV)** dengan template standar yang mudah diisi. Tim *onboarding* kami juga akan mendampingi proses pembersihan dan impor data master pelanggan/jamaah, daftar agen aktif, serta paket keberangkatan yang sedang berjalan agar transisi berjalan mulus."
